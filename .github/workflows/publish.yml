name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "pyproject.toml"
      - "poetry.lock"

permissions:
  contents: write

jobs:
  publish:
    # macOS runner so we can build the universal Swift menu bar binary that
    # gets bundled into the macOS wheel.
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Select newest Xcode
        # The default runner Xcode (15.4 / Swift 5.10) rejects the menu bar
        # app's concurrency code; the newest installed Xcode ships Swift 6.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"

      - name: Install Poetry
        run: pip install poetry wheel

      - name: Set version
        id: version
        run: |
          DATE_PART=$(date -u +%Y.%-m.%-d)
          LAST=$(git tag --list "v${DATE_PART}.*" --sort=-v:refname | head -n1)
          if [ -z "$LAST" ]; then
            REV=1
          else
            REV=$(( ${LAST##*.} + 1 ))
          fi
          VERSION="${DATE_PART}.${REV}"
          poetry version "${VERSION}"
          git tag "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build sdist and pure wheel
        run: poetry build

      - name: Build universal menu bar binary and bundle into wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # Must match platforms: [.macOS(.v14)] in app/Package.swift.
          PLATFORM_TAG: macosx_14_0_universal2
        run: |
          set -euo pipefail
          swift build -c release --package-path app --arch arm64 --arch x86_64
          BIN_PATH="$(swift build -c release --package-path app --arch arm64 --arch x86_64 --show-bin-path)/OzmApp"
          test -f "$BIN_PATH"

          cd dist
          python -m wheel unpack "ozm-${VERSION}-py3-none-any.whl"
          mkdir -p "ozm-${VERSION}/ozm/_bin"
          cp "$BIN_PATH" "ozm-${VERSION}/ozm/_bin/OzmApp"
          chmod +x "ozm-${VERSION}/ozm/_bin/OzmApp"
          python -m wheel pack "ozm-${VERSION}"
          rm -rf "ozm-${VERSION}"
          # Retag the pure wheel as a macOS universal2 wheel and drop the any-tag copy.
          python -m wheel tags --platform-tag "${PLATFORM_TAG}" --remove "ozm-${VERSION}-py3-none-any.whl"
          ls -la

      - name: Publish to PyPI
        run: poetry publish --username __token__ --password "${{ secrets.PYPI_TOKEN }}"

      - name: Push tag
        run: git push origin "v$(poetry version -s)"

      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: |
            dist/ozm-*.tar.gz
            dist/ozm-*-macosx_14_0_universal2.whl
          if-no-files-found: error

  update-formula:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist

      - name: Update formula from the published distributions
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: python scripts/update_formula.py Formula/ozm.rb dist "$VERSION"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ozm.rb
          git diff --cached --quiet || {
            git commit -m "Update formula to ${{ needs.publish.outputs.version }} [skip ci]"
            git push origin main
          }
